<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CTU Registration Assistant</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>CTU Registration</h1>
        <p id="status" role="status">Chua arm lich dang ky.</p>
      </header>

      <form id="run-form">
        <label>
          Gio mo dang ky (gio Viet Nam)
          <input id="opening-at" type="datetime-local" required>
        </label>
        <label>
          Chuan bi truoc (phut)
          <input id="lead-minutes" type="number" min="1" max="30" value="3" required>
        </label>
        <p class="hint">Hay tu chon nhom tren trang CTU truoc khi arm. Extension chi bam nut Đăng ký dung gio.</p>
        <label class="toggle">
          <input id="dry-run" type="checkbox">
          Dry run, khong gui dang ky
        </label>
        <div class="actions">
          <button id="arm" type="submit">Arm dang ky</button>
          <button id="disarm" type="button">Disarm</button>
        </div>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
