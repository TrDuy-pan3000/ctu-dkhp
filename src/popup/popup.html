<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CTU Registration Assistant</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>CTU Registration</h1>
        <p id="status" role="status">Chua arm lich dang ky.</p>
      </header>

      <form id="run-form">
        <label>
          Gio mo dang ky
          <input id="opening-at" type="datetime-local" required>
        </label>
        <label>
          Chuan bi truoc (phut)
          <input id="lead-minutes" type="number" min="1" max="30" value="3" required>
        </label>

        <section aria-labelledby="course-heading">
          <div class="section-heading">
            <h2 id="course-heading">Hoc phan</h2>
            <button id="add-course" type="button" title="Them hoc phan">+</button>
          </div>
          <div id="course-list"></div>
        </section>

        <label class="toggle">
          <input id="dry-run" type="checkbox">
          Dry run, khong gui dang ky
        </label>
        <div class="actions">
          <button id="arm" type="submit">Arm dang ky</button>
          <button id="disarm" type="button">Disarm</button>
        </div>
      </form>
    </main>
    <template id="course-template">
      <fieldset class="course-row">
        <label>Hoc phan <select class="course-code" required><option value="">Dang tai hoc phan...</option></select></label>
        <label>Nhom chinh <select class="primary-group" required><option value="">Chon</option></select></label>
        <label>Nhom du phong <select class="fallback-groups" multiple></select></label>
        <button class="remove-course" type="button" title="Xoa hoc phan">x</button>
      </fieldset>
    </template>
    <script type="module" src="popup.js"></script>
  </body>
</html>
